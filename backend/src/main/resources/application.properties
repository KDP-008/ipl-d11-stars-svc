debug=true

# Database Configuration (supports local defaults and Docker environment variable overrides)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ipld11stars}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:d11appuser}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Schema Initialization
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.continue-on-error=true

# Server Configuration
server.port=8080
server.servlet.context-path=/api

# CORS Configuration
spring.web.cors.allowed-origins=http://localhost:3000
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true

# JWT Configuration (>= 512 bits / 64 bytes for HS512 safety)
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=604800000
jwt.secret=${JWT_SECRET}
jwt.expiration=604800000

# Logging
logging.level.com.ipld11stars.backend=DEBUG
logging.level.org.springframework.security=DEBUG

# Cache Configuration (Caffeine)
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=1000,expireAfterWrite=24h

# IPL API Configuration
ipl.enable.external.api=false
ipl.api.url=https://ipl-stats-sports-mechanic.s3.ap-south-1.amazonaws.com/ipl/feeds/284-matchschedule.js?MatchSchedule=_jqjsp

# Application name
spring.application.name=ipl-d11-stars-backend

# Payments (gateway=mock until a real provider is wired in; webhooks are HMAC-SHA256 signed)
payments.gateway=${PAYMENTS_GATEWAY:mock}
payments.webhook-secret=${PAYMENT_WEBHOOK_SECRET}

# Email notifications (logged only unless MAIL_ENABLED=true and an SMTP server is configured)
app.mail.enabled=${MAIL_ENABLED:false}
app.mail.from=${MAIL_FROM:no-reply@ipld11stars.com}
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Contest lifecycle: how often to close contests whose match has started
contests.scheduler.enabled=true
contests.lock-check-interval-ms=60000
