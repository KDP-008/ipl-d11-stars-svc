# Test Profile Configuration (H2 In-Memory with PostgreSQL compatibility mode)
spring.datasource.url=jdbc:h2:mem:ipld11starstest;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Schema Initialization
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema-test.sql
spring.sql.init.continue-on-error=true

# Server Configuration
server.port=8080
server.servlet.context-path=/api

# CORS Configuration
spring.web.cors.allowed-origins=*
spring.web.cors.allowed-methods=*
spring.web.cors.allowed-headers=*

# JWT Configuration (>= 64 bytes for HS512)
app.jwt.secret=test-only-jwt-signing-key-not-used-outside-the-h2-test-profile-0123456789abcdef
app.jwt.expiration=604800000
jwt.secret=test-only-jwt-signing-key-not-used-outside-the-h2-test-profile-0123456789abcdef
jwt.expiration=604800000

# Cache Configuration
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=1000,expireAfterWrite=24h

# IPL API disabled for offline testing
ipl.enable.external.api=false

# Application name
spring.application.name=ipl-d11-stars-backend-test
