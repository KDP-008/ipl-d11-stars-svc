services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ipld11stars-backend
    ports:
      - '8080:8080'
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/ipld11stars
      - SPRING_DATASOURCE_USERNAME=d11appuser
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      - JWT_SECRET=${JWT_SECRET:?set JWT_SECRET in .env}
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=ipld11stars
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    container_name: ipld11stars-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: d11appuser
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ipld11stars
    ports:
      - '5432:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./sqls/ddl/ddl.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U d11appuser -d ipld11stars"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  db-data:
